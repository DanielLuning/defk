# The Linux measurement run (defk-a1p), on demand only: every example timed
# on a native x86-64 runner (ci/measure.sh). A hosted runner is a shared
# VM, so its numbers are provisional. The log and the conditions are kept
# as an artifact for 90 days.
name: Measure

on:
  workflow_dispatch:

jobs:
  measure:
    name: linux-x86_64-clang bench
    runs-on: ubuntu-24.04
    container: docker.io/hexpm/elixir:1.20.2-erlang-29.0.3-debian-trixie-20260713
    timeout-minutes: 240
    env:
      CC: clang
      LANG: C.UTF-8
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@v7
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: ci/setup-debian.sh
      # the examples' comparison packages: cargo (blake3's Rust NIF), cmake
      # (crc32cer), and the word list fuzzy_search's tests read
      - run: apt-get update && apt-get install -y --no-install-recommends cargo cmake wamerican
      - run: ci/measure.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: measure-linux-x86_64-clang
          path: tmp/measure/
          retention-days: 90
